<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>저메추 - 저녁 메뉴 추천</title>
  <style>
    :root {
      --primary: #FF6B6B;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text: #333333;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
    h1 { text-align: center; color: var(--primary); margin-bottom: 8px; margin-top: 0; }
    p.subtitle { text-align: center; color: #666; margin-top: 0; font-size: 0.9em; }
    .step { display: none; margin-top: 20px; }
    .step.active { display: block; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button {
      flex: 1;
      padding: 14px;
      border: 1px solid #DDD;
      border-radius: 10px;
      background: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { border-color: var(--primary); color: var(--primary); }
    button.primary { background: var(--primary); color: #fff; border: none; }
    button.primary:hover { opacity: 0.9; color: #fff; }
    select, input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #DDD;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .result-card {
      background: #FFF5F5;
      border: 1px solid #FFE3E3;
      padding: 16px;
      border-radius: 10px;
      margin-top: 15px;
    }
    .result-title { font-weight: bold; font-size: 1.1rem; color: var(--primary); margin-bottom: 8px; }
    .result-desc { color: #555; font-size: 0.95rem; line-height: 1.5; white-space: pre-line; }
    .recipe-btn {
      margin-top: 10px;
      background: #4dabf7;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🍽️ 저메추</h1>
  <p class="subtitle">오늘 저녁 뭐 먹지? 고민 끝! (100개 메뉴 보장)</p>

  <!-- STEP 1 -->
  <div id="step1" class="step active">
    <h3>STEP 1. 어떻게 드실 건가요?</h3>
    <div class="btn-group">
      <button onclick="selectType('delivery')">🛵 시켜먹기</button>
      <button onclick="selectType('cook')">🍳 만들어 먹기</button>
    </div>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step">
    <h3>STEP 2. 원하는 카테고리</h3>
    <select id="category">
      <option value="all">🎲 상관없음 (랜덤 추천)</option>
      <option value="korean">🍚 한식</option>
      <option value="chinese">🥢 중식</option>
      <option value="japanese">🍣 일식</option>
      <option value="western">🍝 양식</option>
      <option value="snack">떡볶이/분식</option>
      <option value="asian">🌏 아시안/기타</option>
    </select>
    <div class="btn-group">
      <button class="primary" onclick="nextFromStep2()">다음</button>
    </div>
  </div>

  <!-- STEP 3-1: 시켜먹기 예산 (가격대 2개 추가되어 총 5단계) -->
  <div id="step3-delivery" class="step">
    <h3>STEP 3. 원하는 예산대 (1인 기준)</h3>
    <select id="budget">
      <option value="8000">8,000원 이하 (초가성비)</option>
      <option value="12000" selected>8,000원 ~ 12,000원 (실속형)</option>
      <option value="16000">12,000원 ~ 16,000원 (일반적)</option>
      <option value="22000">16,000원 ~ 22,000원 (푸짐하게)</option>
      <option value="999999">제한 없음 (플렉스)</option>
    </select>
    <div class="btn-group">
      <button class="primary" onclick="getDeliveryRecommendation()">추천받기</button>
    </div>
  </div>

  <!-- STEP 3-2: 만들어 먹기 요리 선택 -->
  <div id="step3-cook" class="step">
    <h3>STEP 3. 추천 메뉴 및 재료</h3>
    <p style="font-size: 0.85rem; color: #777;">아래 추천 메뉴 중 하나를 골라 레시피를 확인하세요.</p>
    <div id="cook-menu-list"></div>
  </div>

  <!-- STEP 4-1: 시켜먹기 결과 -->
  <div id="step4-delivery" class="step">
    <h3>STEP 4. 추천 결과</h3>
    <div id="delivery-result"></div>
    <button onclick="resetApp()" style="margin-top: 15px;">처음으로 돌아가기</button>
  </div>

  <!-- STEP 4-2: 레시피 결과 -->
  <div id="step4-recipe" class="step">
    <h3>STEP 4. 상세 레시피</h3>
    <div id="recipe-result"></div>
    <button onclick="showStep('step3-cook')" style="margin-top: 15px;">다른 메뉴 보기</button>
    <button onclick="resetApp()" style="margin-top: 5px;">처음으로 돌아가기</button>
  </div>
</div>

      {

  let state = { type: '', category: '', budget: 999999 };

  function showStep(id) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function selectType(type) {
    state.type = type;
    showStep('step2');
  }

  function nextFromStep2() {
    state.category = document.getElementById('category').value;
    if (state.type === 'delivery') {
      showStep('step3-delivery');
    } else {
      renderCookMenuList();
      showStep('step3-cook');
    }
  }

  function getRandomItems(arr, count) {
    const shuffled = [...arr].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, count);
  }

  function getDeliveryRecommendation() {
    state.budget = parseInt(document.getElementById('budget').value);
    
    let filtered = menuData.delivery;
    if (state.category !== 'all') {
      filtered = filtered.filter(item => item.category === state.category);
    }
    filtered = filtered.filter(item => item.price <= state.budget);

    const resultBox = document.getElementById('delivery-result');
    resultBox.innerHTML = '';

    if (filtered.length === 0) {
      resultBox.innerHTML = `<div class="result-card"><div class="result-desc">선택하신 예산 범위 내에 조건이 맞는 메뉴가 없습니다. 예산을 조금 더 늘려보세요!</div></div>`;
    } else {
      const picks = getRandomItems(filtered, Math.min(3, filtered.length));
      picks.forEach(item => {
        resultBox.innerHTML += `
          <div class="result-card">
            <div class="result-title">${item.name} (약 ${item.price.toLocaleString()}원)</div>
            <div class="result-desc">${item.desc}</div>
          </div>
        `;
      });
    }
    showStep('step4-delivery');
  }

  function renderCookMenuList() {
    let filtered = menuData.cook;
    if (state.category !== 'all') {
      filtered = filtered.filter(item => item.category === state.category);
    }

    const listContainer = document.getElementById('cook-menu-list');
    listContainer.innerHTML = '';

    if (filtered.length === 0) {
      listContainer.innerHTML = `<div class="result-card"><div class="result-desc">해당 카테고리의 요리가 없습니다. 다른 카테고리를 선택해보세요.</div></div>`;
      return;
    }

    filtered.forEach((item) => {
      listContainer.innerHTML += `
        <div class="result-card">
          <div class="result-title">${item.name}</div>
          <div class="result-desc"><b>필요 재료:</b> ${item.ingredients}</div>
          <button class="recipe-btn" onclick="showRecipe('${item.name}')">레시피 보기</button>
        </div>
      `;
    });
  }

  function showRecipe(menuName) {
    const item = menuData.cook.find(m => m.name === menuName);
    if (!item) return;

    const resultBox = document.getElementById('recipe-result');
    resultBox.innerHTML = `
      <div class="result-card">
        <div class="result-title">${item.name}</div>
        <div class="result-desc">
<b>조리 시간:</b> ${item.time} | <b>난이도:</b> ${item.difficulty}

<b>필요 재료:</b>
${item.ingredients}

<b>조리 순서:</b>
${item.recipe}
        </div>
      </div>
    `;
    showStep('step4-recipe');
  }

  function resetApp() {
    state = { type: '', category: '', budget: 999999 };
    document.getElementById('category').value = 'all';
    showStep('step1');
  }
</script>
